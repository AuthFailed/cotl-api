<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cult of the Lamb data API</title>
  <meta name="description" content="Static JSON API with Cult of the Lamb items, structures and follower skins in every game language.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <meta name="color-scheme" content="light dark">
  <style>
    body { margin: 0; background: #fafafa; }
    .swagger-ui .topbar { display: none; }
    /* Swagger UI has no dark theme: invert it, and invert images back so icons keep their colours. */
    @media (prefers-color-scheme: dark) {
      body { background: #141414; }
      .swagger-ui { filter: invert(0.9) hue-rotate(180deg); }
      .swagger-ui img, .swagger-ui .microlight { filter: invert(1) hue-rotate(180deg); }
    }
  </style>
</head>
<body>
  <div id="docs"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({ url: "openapi.json", dom_id: "#docs", deepLinking: true, defaultModelsExpandDepth: 0, tryItOutEnabled: true });
  </script>
</body>
</html>
